name: Published dependency contract

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: rulesforge-published-deps-${{ github.ref }}
  cancel-in-progress: true

env:
  EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  qualify:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-24.04
            rid: linux-x64
            triplet: x64-linux
          - name: Windows x64
            os: windows-2022
            rid: windows-x64
            triplet: x64-windows

    steps:
      - name: Checkout exact RulesForge head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact source identity
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:EXPECTED_SHA) {
            throw "checked out $actual, expected $env:EXPECTED_SHA"
          }
          if (-not [string]::IsNullOrWhiteSpace($env:GITHUB_BASE_REF)) {
            git fetch origin $env:GITHUB_BASE_REF --depth=1
            if ($LASTEXITCODE -ne 0) { throw "failed to fetch PR base" }
            $base = (git merge-base HEAD "origin/$env:GITHUB_BASE_REF").Trim()
            git diff --check $base HEAD
          } else {
            git diff --check HEAD^ HEAD
          }
          if ($LASTEXITCODE -ne 0) { throw "git diff --check failed" }
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { throw "working tree is dirty" }

      - name: Use empty vcpkg L1 cache
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $cache = Join-Path $env:RUNNER_TEMP "rulesforge-empty-vcpkg-l1"
          if (Test-Path -LiteralPath $cache) {
            Remove-Item -LiteralPath $cache -Recurse -Force
          }
          New-Item -ItemType Directory -Force -Path $cache | Out-Null
          "VCPKG_BINARY_CACHE=$cache" >> $env:GITHUB_ENV

      - name: Configure shared vcpkg binary cache
        uses: qigao/vcpkg-cache/.github/actions/setup-vcpkg-cache@master
        with:
          mode: read

      - name: Restore canonical re2c host tool
        uses: qigao/vcpkg-cache/.github/actions/setup-re2c-tools@master

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install Linux build tools
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build pkg-config

      - name: Locate MSVC
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio/Installer/vswhere.exe"
          $vs = & $vswhere -latest -products "*" -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($vs)) {
            throw "x64 MSVC was not found"
          }
          "VSINSTALL=$vs" >> $env:GITHUB_ENV

      - name: Install Windows Ninja
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install ninja -y --no-progress

      - name: Restore latest published native SDKs
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./cmake/ci/restore-native-sdks.ps1 -Rid ${{ matrix.rid }}

      - name: Verify canonical dependency environment
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (-not (Test-Path -LiteralPath $env:QIGAO_VCPKG_TOOLCHAIN_FILE -PathType Leaf)) {
            throw "qigao/vcpkg-cache toolchain is unavailable"
          }
          if ($env:VCPKG_BINARY_SOURCES -notmatch "nugetconfig") {
            throw "shared GitHub Packages vcpkg cache is not configured"
          }
          if ($env:VCPKG_NUGET_REPOSITORY -ne "https://github.com/qigao/vcpkg-cache") {
            throw "unexpected vcpkg cache repository: $env:VCPKG_NUGET_REPOSITORY"
          }
          if ([string]::IsNullOrWhiteSpace($env:SALTS_PACKAGE_VERSION)) { throw "resolved Salts package identity is unavailable" }
          if ([string]::IsNullOrWhiteSpace($env:SALTS_UTILS_PACKAGE_VERSION)) { throw "resolved SaltsUtils package identity is unavailable" }

      - name: Configure, build, test and install on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          build="$GITHUB_WORKSPACE/build/published-release"
          prefix="$GITHUB_WORKSPACE/stage/${{ matrix.rid }}"
          cmake -S . -B "$build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$QIGAO_VCPKG_TOOLCHAIN_FILE" \
            -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }} \
            -DVCPKG_INSTALLED_DIR="$GITHUB_WORKSPACE/vcpkg_installed" \
            -DVCPKG_INSTALL_OPTIONS=--only-binarycaching \
            -DENABLE_TESTS=ON -DBUILD_TESTING=ON \
            -DCMAKE_INSTALL_PREFIX="$prefix"
          cmake --build "$build" --parallel 2
          ctest --test-dir "$build" --no-tests=error --output-on-failure
          cmake --install "$build"
          test -f "$prefix/include/rules_forge.h"
          test -f "$prefix/lib/cmake/RulesForge/RulesForgeConfig.cmake"
          test -f "$prefix/lib/libRulesForge.so"

      - name: Qualify installed consumer on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          prefix="$GITHUB_WORKSPACE/stage/${{ matrix.rid }}"
          consumer="$GITHUB_WORKSPACE/build/package-consumer"
          RULES_FORGE_ROOT="$prefix" \
          cmake -S tests/package_consumer -B "$consumer" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$QIGAO_VCPKG_TOOLCHAIN_FILE" \
            -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }} \
            -DVCPKG_INSTALLED_DIR="$GITHUB_WORKSPACE/vcpkg_installed" \
            -DVCPKG_INSTALL_OPTIONS=--only-binarycaching
          cmake --build "$consumer" --parallel 2
          LD_LIBRARY_PATH="$prefix/lib:${LD_LIBRARY_PATH:-}" \
            "$consumer/rulesforge_package_consumer"

      - name: Configure, build, test and install on Windows
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          set "QIGAO_CANONICAL_VCPKG_ROOT=%VCPKG_ROOT%"
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64 >nul
          if errorlevel 1 exit /b 1
          set "VCPKG_ROOT=%QIGAO_CANONICAL_VCPKG_ROOT%"
          cmake -S . -B build\published-release -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE="%QIGAO_VCPKG_TOOLCHAIN_FILE%" -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }} -DVCPKG_HOST_TRIPLET=x64-windows -DVCPKG_INSTALLED_DIR="%GITHUB_WORKSPACE%\vcpkg_installed" -DVCPKG_INSTALL_OPTIONS=--only-binarycaching -DENABLE_TESTS=ON -DBUILD_TESTING=ON -DCMAKE_INSTALL_PREFIX="%GITHUB_WORKSPACE%\stage\${{ matrix.rid }}"
          if errorlevel 1 exit /b 1
          cmake --build build\published-release --parallel 2
          if errorlevel 1 exit /b 1
          ctest --test-dir build\published-release --no-tests=error --output-on-failure
          if errorlevel 1 exit /b 1
          cmake --install build\published-release
          if errorlevel 1 exit /b 1

      - name: Verify and consume installed SDK on Windows
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          set "QIGAO_CANONICAL_VCPKG_ROOT=%VCPKG_ROOT%"
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64 >nul
          if errorlevel 1 exit /b 1
          set "VCPKG_ROOT=%QIGAO_CANONICAL_VCPKG_ROOT%"
          if not exist "%GITHUB_WORKSPACE%\stage\${{ matrix.rid }}\include\rules_forge.h" exit /b 1
          if not exist "%GITHUB_WORKSPACE%\stage\${{ matrix.rid }}\lib\cmake\RulesForge\RulesForgeConfig.cmake" exit /b 1
          if not exist "%GITHUB_WORKSPACE%\stage\${{ matrix.rid }}\bin\RulesForge.dll" exit /b 1
          set "RULES_FORGE_ROOT=%GITHUB_WORKSPACE%\stage\${{ matrix.rid }}"
          set "PATH=%RULES_FORGE_ROOT%\bin;%PATH%"
          cmake -S tests\package_consumer -B build\package-consumer -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE="%QIGAO_VCPKG_TOOLCHAIN_FILE%" -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }} -DVCPKG_HOST_TRIPLET=x64-windows -DVCPKG_INSTALLED_DIR="%GITHUB_WORKSPACE%\vcpkg_installed" -DVCPKG_INSTALL_OPTIONS=--only-binarycaching
          if errorlevel 1 exit /b 1
          cmake --build build\package-consumer --parallel 2
          if errorlevel 1 exit /b 1
          build\package-consumer\rulesforge_package_consumer.exe
          if errorlevel 1 exit /b 1

      - name: Verify source remains exact
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:EXPECTED_SHA) { throw "source SHA drifted" }
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { throw "tracked source was modified" }

      - name: Upload installed SDK evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rulesforge-published-deps-${{ matrix.rid }}-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            stage/${{ matrix.rid }}/
