name: Release SDK

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: rulesforge-release-sdk-${{ github.ref }}
  cancel-in-progress: true

env:
  EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  VCPKG_COMMIT: b1b19307e2d2ec1eefbdb7ea069de7d4bcd31f01
  SALTS_REF: master
  SALTS_UTILS_REF: master

jobs:
  linux-release:
    name: Linux Release SDK
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact RulesForge head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact source identity
        shell: bash
        run: |
          set -euxo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git diff --check HEAD^ HEAD
          git diff --exit-code

      - name: Checkout Salts master
        uses: actions/checkout@v4
        with:
          repository: qigao/salts
          ref: ${{ env.SALTS_REF }}
          path: .ci/deps/salts
          persist-credentials: false

      - name: Checkout Salts masterUtils
        uses: actions/checkout@v4
        with:
          repository: qigao/salts-utils
          ref: ${{ env.SALTS_UTILS_REF }}
          path: .ci/deps/salts-utils
          persist-credentials: false


      - name: Resolve dependency revisions
        id: dependency-revisions
        shell: bash
        run: |
          set -euo pipefail
          salts_sha="$(git -C .ci/deps/salts rev-parse HEAD)"
          salts_utils_sha="$(git -C .ci/deps/salts-utils rev-parse HEAD)"
          test -n "$salts_sha"
          test -n "$salts_utils_sha"
          echo "salts_sha=$salts_sha" >> "$GITHUB_OUTPUT"
          echo "salts_utils_sha=$salts_utils_sha" >> "$GITHUB_OUTPUT"
          printf 'salts-ref=%s\nsalts=%s\nsalts-utils-ref=%s\nsalts-utils=%s\n' \
            "$SALTS_REF" "$salts_sha" "$SALTS_UTILS_REF" "$salts_utils_sha"

      - name: Select RulesForge vcpkg L1 cache
        shell: bash
        run: echo "VCPKG_BINARY_CACHE=$HOME/.cache/vcpkg/archives" >> "$GITHUB_ENV"

      - name: Configure shared vcpkg cache and canonical tool
        uses: qigao/vcpkg-cache/.github/actions/setup-vcpkg-cache@master
        with:
          mode: read

      - name: Cache vcpkg binary archives
        uses: actions/cache@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: rulesforge-vcpkg-${{ runner.os }}-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            rulesforge-vcpkg-${{ runner.os }}-${{ env.VCPKG_COMMIT }}-



      - name: Restore dependency SDKs
        id: dependency-sdk-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ runner.temp }}/sdk/salts-release
            ${{ runner.temp }}/sdk/salts-utils-release
          key: rulesforge-dependency-sdk-${{ runner.os }}-${{ steps.dependency-revisions.outputs.salts_sha }}-${{ steps.dependency-revisions.outputs.salts_utils_sha }}-${{ env.VCPKG_COMMIT }}

      - name: Prepare Linux toolchain
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config nasm curl xz-utils autoconf automake libtool
          test -x "$VCPKG_ROOT/vcpkg"
          "$VCPKG_ROOT/vcpkg" version
          sudo mkdir -p /opt
          sudo ln -sfn "$VCPKG_ROOT" /opt/vcpkg


      - name: Restore shared re2c binary
        uses: qigao/vcpkg-cache/.github/actions/setup-re2c-tools@master

      - name: Build standalone host Lemon
        if: steps.dependency-sdk-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euxo pipefail
          cmake -S .ci/deps/salts-utils/tools/lemon -B "$RUNNER_TEMP/host-lemon" -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/host-lemon" --target lemon -j2

      - name: Build Salts Release SDK
        if: steps.dependency-sdk-cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          PROJECT_ROOT: ${{ runner.temp }}/salts-project
        run: |
          set -euxo pipefail
          cmake -S .ci/deps/salts -B "$RUNNER_TEMP/build/salts-release" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/sdk/salts-release" \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=x64-linux -DENABLE_TESTS=OFF -DBUILD_TESTS=OFF -DBUILD_EXAMPLES=OFF
          cmake --build "$RUNNER_TEMP/build/salts-release" --target install -j2

      - name: Build SaltsUtils Release SDK with DataBind
        if: steps.dependency-sdk-cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          SALTS_ROOT: ${{ runner.temp }}/sdk/salts-release
        run: |
          set -euxo pipefail
          cmake -S .ci/deps/salts-utils -B "$RUNNER_TEMP/build/salts-utils-release" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DSALTS_UTILS_HOST_LEMON_EXECUTABLE="$RUNNER_TEMP/host-lemon/lemon" \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=x64-linux -DENABLE_TESTS=OFF -DBUILD_TESTS=OFF -DBUILD_EXAMPLES=OFF
          cmake --build "$RUNNER_TEMP/build/salts-utils-release" -j2
          cmake --install "$RUNNER_TEMP/build/salts-utils-release" \
            --prefix "$RUNNER_TEMP/sdk/salts-utils-release"

      - name: Save dependency SDKs
        if: steps.dependency-sdk-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ runner.temp }}/sdk/salts-release
            ${{ runner.temp }}/sdk/salts-utils-release
          key: rulesforge-dependency-sdk-${{ runner.os }}-${{ steps.dependency-revisions.outputs.salts_sha }}-${{ steps.dependency-revisions.outputs.salts_utils_sha }}-${{ env.VCPKG_COMMIT }}

      - name: Validate cached dependency SDKs
        shell: bash
        run: |
          set -euxo pipefail
          test -d "$RUNNER_TEMP/sdk/salts-release/include"
          test -d "$RUNNER_TEMP/sdk/salts-utils-release/include"
          test -f "$RUNNER_TEMP/sdk/salts-utils-release/lib/cmake/SaltsUtils/SaltsUtilsConfig.cmake"
          test -f "$RUNNER_TEMP/sdk/salts-utils-release/include/data_bind.h"
          test -x "$RUNNER_TEMP/sdk/salts-utils-release/bin/tbe_compiler"
          test -d "$RUNNER_TEMP/sdk/salts-utils-release/bin/templates"
          test ! -e "$RUNNER_TEMP/sdk/salts-utils-release/lib/cmake/DataBind/DataBindConfig.cmake"
          sudo mkdir -p /opt/salts /opt/salts-utils
          sudo ln -sfn "$RUNNER_TEMP/sdk/salts-release" /opt/salts/release
          sudo ln -sfn "$RUNNER_TEMP/sdk/salts-utils-release" /opt/salts-utils/release

      - name: Configure RulesForge Release
        shell: bash
        env:
          PKG_ROOT: /opt
          VCPKG_INSTALLED_DIR: ${{ github.workspace }}/vcpkg_installed
          SALTS_ROOT: ${{ runner.temp }}/sdk/salts-release
          SALTS_UTILS_ROOT: ${{ runner.temp }}/sdk/salts-utils-release
        run: |
          set -euxo pipefail
          cmake --preset linux-release-user \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/sdk/rules-forge-release" \
            2>&1 | tee "$RUNNER_TEMP/rulesforge-release-configure.log"

      - name: Build and install RulesForge Release SDK
        shell: bash
        run: |
          set -euxo pipefail
          cmake --build --preset linux-release-user -j2 2>&1 | tee "$RUNNER_TEMP/rulesforge-release-build.log"
          cmake --build build/linux-gcc-release --target install -j2 2>&1 | tee "$RUNNER_TEMP/rulesforge-release-install.log"
          test -d "$RUNNER_TEMP/sdk/rules-forge-release/include"

      - name: Consume installed RulesForge with canonical SaltsUtils root
        shell: bash
        env:
          RULES_FORGE_ROOT: ${{ runner.temp }}/sdk/rules-forge-release
          SALTS_ROOT: ${{ runner.temp }}/sdk/salts-release
          SALTS_UTILS_ROOT: ${{ runner.temp }}/sdk/salts-utils-release
          CMAKE_PREFIX_PATH: ${{ github.workspace }}/vcpkg_installed/x64-linux
          LD_LIBRARY_PATH: ${{ runner.temp }}/sdk/rules-forge-release/lib:${{ runner.temp }}/sdk/salts-utils-release/lib:${{ runner.temp }}/sdk/salts-release/lib
        run: |
          set -euxo pipefail
          test -f "$SALTS_UTILS_ROOT/lib/cmake/SaltsUtils/SaltsUtilsConfig.cmake"
          cmake -S tests/package_consumer -B "$RUNNER_TEMP/build/rulesforge-consumer" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=x64-linux
          cmake --build "$RUNNER_TEMP/build/rulesforge-consumer" -j2
          "$RUNNER_TEMP/build/rulesforge-consumer/rulesforge_package_consumer"

      - name: Reject installed consumer when SaltsUtils lacks DataBind targets
        shell: bash
        env:
          RULES_FORGE_ROOT: ${{ runner.temp }}/sdk/rules-forge-release
          SALTS_ROOT: ${{ runner.temp }}/sdk/salts-release
        run: |
          set -euxo pipefail
          fake_root="$RUNNER_TEMP/sdk/salts-utils-without-databind"
          source_dir="$RUNNER_TEMP/rulesforge-missing-databind-consumer"
          build_dir="$RUNNER_TEMP/build/rulesforge-missing-databind-consumer"
          rm -rf "$fake_root" "$source_dir" "$build_dir"
          mkdir -p "$fake_root/lib/cmake/SaltsUtils" "$source_dir"
          cat > "$fake_root/lib/cmake/SaltsUtils/SaltsUtilsConfig.cmake" <<'EOF'
          set(SaltsUtils_FOUND TRUE)
          EOF
          cat > "$source_dir/CMakeLists.txt" <<'EOF'
          cmake_minimum_required(VERSION 3.20)
          project(RulesForgeMissingDataBind LANGUAGES C)
          find_package(RulesForge 0.9 CONFIG REQUIRED
            PATHS "$ENV{RULES_FORGE_ROOT}" NO_DEFAULT_PATH)
          EOF
          set +e
          SALTS_UTILS_ROOT="$fake_root" cmake -S "$source_dir" -B "$build_dir" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=x64-linux \
            >"$RUNNER_TEMP/rulesforge-missing-databind.log" 2>&1
          status=$?
          set -e
          test "$status" -ne 0
          grep -F "SaltsUtils package is missing required DataBind target: Salts::DataBind" \
            "$RUNNER_TEMP/rulesforge-missing-databind.log"

      - name: Verify committed source remained untouched
        if: always()
        shell: bash
        run: |
          set -euxo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git diff --exit-code

      - name: Upload Release SDK evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rulesforge-release-sdk-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/rulesforge-release-*.log
            ${{ runner.temp }}/sdk/rules-forge-release/
