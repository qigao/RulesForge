name: RulesForge native CI

on:
  push:
    branches: [master, 'ci/**']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: rulesforge-native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: ${{ matrix.rid }} / ${{ matrix.compiler }} / Release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            rid: linux-x64
            compiler: GCC
            preset: ci-linux-x64
          - os: ubuntu-24.04-arm
            rid: linux-arm64
            compiler: GCC
            preset: ci-linux-arm64
          - os: windows-2025
            rid: windows-x64
            compiler: MSVC
            preset: ci-windows-x64
          - os: macos-15
            rid: macos-arm64
            compiler: AppleClang
            preset: ci-macos-arm64
    env:
      CCACHE_DIR: ${{ github.workspace }}/build/ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 1G
      VCPKG_BINARY_CACHE: ${{ github.workspace }}/build/vcpkg-binary-cache
      CMAKE_BUILD_PARALLEL_LEVEL: 2
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Linux build tools
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build ccache pkg-config nasm

      - name: Install macOS build tools
        if: runner.os == 'macOS'
        shell: bash
        run: brew install ninja ccache pkgconf nasm

      - name: Install Windows build tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install ninja ccache -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw "Build tool installation failed" }
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio/Installer/vswhere.exe"
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($vs)) { throw "MSVC is unavailable" }
          "VSINSTALL=$vs" >> $env:GITHUB_ENV

      - name: Configure shared vcpkg cache
        id: vcpkg
        uses: qigao/vcpkg-cache/.github/actions/setup-vcpkg-cache@master
        with:
          mode: read

      - name: Restore vcpkg binary payloads
        uses: actions/cache@v4
        with:
          path: build/vcpkg-binary-cache
          key: vcpkg-${{ matrix.os }}-${{ matrix.preset }}-${{ steps.vcpkg.outputs.cache_revision }}-${{ hashFiles('vcpkg.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            vcpkg-${{ matrix.os }}-${{ matrix.preset }}-${{ steps.vcpkg.outputs.cache_revision }}-${{ hashFiles('vcpkg.json') }}-

      - name: Restore canonical re2c host tool
        uses: qigao/vcpkg-cache/.github/actions/setup-re2c-tools@master

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore native SDK payload cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/rulesforge-nuget
          key: native-sdks-${{ matrix.os }}-${{ matrix.rid }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            native-sdks-${{ matrix.os }}-${{ matrix.rid }}-

      - name: Resolve latest SDKs including prereleases
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./cmake/ci/restore-native-sdks.ps1 -Rid '${{ matrix.rid }}'

      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-v1-${{ matrix.os }}-${{ matrix.preset }}-${{ steps.vcpkg.outputs.cache_revision }}-${{ hashFiles('CMakeUserPresets.json', 'presets/*.json', 'vcpkg.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ccache-v1-${{ matrix.os }}-${{ matrix.preset }}-${{ steps.vcpkg.outputs.cache_revision }}-${{ hashFiles('CMakeUserPresets.json', 'presets/*.json', 'vcpkg.json') }}-

      - name: Initialize compiler cache statistics
        shell: pwsh
        run: |
          ccache --version
          if ($LASTEXITCODE -ne 0) { throw "ccache is unavailable" }
          ccache --zero-stats
          if ($LASTEXITCODE -ne 0) { throw "ccache initialization failed" }

      - name: Configure, build, test and install on Unix
        if: runner.os != 'Windows'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CI_PRESET: ${{ matrix.preset }}
        run: |
          set -euo pipefail
          cmake --preset "$CI_PRESET"
          cmake --build --preset "$CI_PRESET"
          ctest --preset "$CI_PRESET" --output-on-failure
          cmake --build --preset "install-$CI_PRESET"

      - name: Configure, build, test and install on Windows
        if: runner.os == 'Windows'
        shell: cmd
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CI_PRESET: ${{ matrix.preset }}
        run: |
          set "CI_CANONICAL_VCPKG_ROOT=%VCPKG_ROOT%"
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64 >nul
          if errorlevel 1 exit /b 1
          set "VCPKG_ROOT=%CI_CANONICAL_VCPKG_ROOT%"
          cmake --preset %CI_PRESET%
          if errorlevel 1 exit /b 1
          cmake --build --preset %CI_PRESET%
          if errorlevel 1 exit /b 1
          ctest --preset %CI_PRESET% --output-on-failure
          if errorlevel 1 exit /b 1
          cmake --build --preset install-%CI_PRESET%
          if errorlevel 1 exit /b 1

      - name: Report compiler cache statistics
        if: always()
        shell: pwsh
        run: |
          if (Get-Command ccache -ErrorAction SilentlyContinue) {
            ccache --show-stats --verbose | Tee-Object -FilePath "$env:RUNNER_TEMP/ccache-stats.txt"
            Get-Content "$env:RUNNER_TEMP/ccache-stats.txt" >> $env:GITHUB_STEP_SUMMARY
          }

      - name: Upload test reports and installed SDK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rulesforge-${{ matrix.rid }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            build/${{ matrix.preset }}/ctest.xml
            build/${{ matrix.preset }}/Testing/Temporary/
            build/${{ matrix.preset }}/CMakeFiles/CMakeConfigureLog.yaml
            build/${{ matrix.preset }}/vcpkg-manifest-install.log
            stage/${{ matrix.preset }}/
            ${{ runner.temp }}/ccache-stats.txt
