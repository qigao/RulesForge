name: RulesForge native SDK release

on:
  push:
    branches: [master]
    tags: ["v*"]
    paths:
      - ".github/workflows/native-nuget-release.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: rulesforge-native-sdk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  metadata:
    name: Release metadata
    if: >-
      github.ref_type == 'tag' ||
      (github.ref_name == 'master' && startsWith(github.event.head_commit.message, 'release: publish RulesForge package'))
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      source_commit: ${{ steps.version.outputs.source_commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - id: version
        name: Validate release identity
        shell: bash
        run: |
          set -euo pipefail
          major="$(awk '/set\(CMAKE_PROJECT_VERSION_MAJOR/{gsub(/[)]/,"",$2); print $2; exit}' CMakeLists.txt)"
          minor="$(awk '/set\(CMAKE_PROJECT_VERSION_MINOR/{gsub(/[)]/,"",$2); print $2; exit}' CMakeLists.txt)"
          patch="$(awk '/set\(CMAKE_PROJECT_VERSION_PATCH/{gsub(/[)]/,"",$2); print $2; exit}' CMakeLists.txt)"
          version="$major.$minor.$patch"
          manifest_version="$(python3 -c 'import json; print(json.load(open("vcpkg.json", encoding="utf-8"))["version-semver"])')"
          test "$manifest_version" = "$version"
          tag="v$version"
          source_commit="$(git rev-parse HEAD)"
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            if [[ "$GITHUB_REF_NAME" != "$tag" ]]; then
              echo "release tag mismatch: pushed=$GITHUB_REF_NAME expected=$tag" >&2
              exit 1
            fi
          else
            test "${GITHUB_REF_NAME:-}" = "master"
            test "${{ startsWith(github.event.head_commit.message, 'release: publish RulesForge package') }}" = "true"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "source_commit=$source_commit" >> "$GITHUB_OUTPUT"

  linux:
    name: Linux x64 SDK
    needs: metadata
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Use empty vcpkg L1 cache
        shell: bash
        run: |
          set -euo pipefail
          cache="$RUNNER_TEMP/rulesforge-release-empty-l1"
          rm -rf "$cache"
          mkdir -p "$cache"
          echo "VCPKG_BINARY_CACHE=$cache" >> "$GITHUB_ENV"

      - name: Configure shared vcpkg binary cache
        uses: qigao/vcpkg-cache/.github/actions/setup-vcpkg-cache@master
        with:
          mode: read

      - name: Restore canonical re2c host tool
        uses: qigao/vcpkg-cache/.github/actions/setup-re2c-tools@master

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install build tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build pkg-config

      - name: Restore published Salts SDK pair
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./cmake/ci/restore-native-sdks.ps1 -Rid linux-x64

      - name: Configure release SDK
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build/native-release -G Ninja             -DCMAKE_BUILD_TYPE=Release             -DCMAKE_TOOLCHAIN_FILE="$QIGAO_VCPKG_TOOLCHAIN_FILE"             -DVCPKG_TARGET_TRIPLET=x64-linux             -DVCPKG_INSTALLED_DIR="$GITHUB_WORKSPACE/vcpkg_installed"             -DVCPKG_INSTALL_OPTIONS=--only-binarycaching             -DENABLE_TESTS=OFF             -DBUILD_TESTING=OFF             -DENABLE_SAMPLES=OFF             -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/stage/sdk/linux-x64"

      - name: Build and install SDK
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build/native-release --target RulesForge --parallel 2
          cmake --install build/native-release --strip
          prefix="$GITHUB_WORKSPACE/stage/sdk/linux-x64"
          test -f "$prefix/include/rules_forge.h"
          test -f "$prefix/lib/cmake/RulesForge/RulesForgeConfig.cmake"
          test -f "$prefix/lib/libRulesForge.so"
          {
            echo "package=RulesForge.Native"
            echo "version=${{ needs.metadata.outputs.version }}"
            echo "rid=linux-x64"
            echo "salts=$SALTS_PACKAGE_VERSION"
            echo "saltsutils=$SALTS_UTILS_PACKAGE_VERSION"
            echo "databind_abi=9"
            echo "profile=release"
            echo "source=$GITHUB_SHA"
          } > "$prefix/rulesforge-sdk-manifest.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: rulesforge-sdk-linux-x64
          path: stage/sdk/linux-x64
          if-no-files-found: error

  windows:
    name: Windows x64 SDK
    needs: metadata
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Use empty vcpkg L1 cache
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $cache = Join-Path $env:RUNNER_TEMP "rulesforge-release-empty-l1"
          if (Test-Path -LiteralPath $cache) { Remove-Item -LiteralPath $cache -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $cache | Out-Null
          "VCPKG_BINARY_CACHE=$cache" >> $env:GITHUB_ENV

      - name: Configure shared vcpkg binary cache
        uses: qigao/vcpkg-cache/.github/actions/setup-vcpkg-cache@master
        with:
          mode: read

      - name: Restore canonical re2c host tool
        uses: qigao/vcpkg-cache/.github/actions/setup-re2c-tools@master

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Locate MSVC
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio/Installer/vswhere.exe"
          $vs = & $vswhere -latest -products "*" -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($vs)) { throw "x64 MSVC was not found" }
          "VSINSTALL=$vs" >> $env:GITHUB_ENV

      - name: Install Ninja
        shell: pwsh
        run: choco install ninja -y --no-progress

      - name: Restore published Salts SDK pair
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./cmake/ci/restore-native-sdks.ps1 -Rid windows-x64

      - name: Configure, build and install release SDK
        shell: cmd
        run: |
          set "QIGAO_CANONICAL_VCPKG_ROOT=%VCPKG_ROOT%"
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64 >nul
          if errorlevel 1 exit /b 1
          set "VCPKG_ROOT=%QIGAO_CANONICAL_VCPKG_ROOT%"
          cmake -S . -B build\native-release -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE="%QIGAO_VCPKG_TOOLCHAIN_FILE%" -DVCPKG_TARGET_TRIPLET=x64-windows -DVCPKG_INSTALLED_DIR="%GITHUB_WORKSPACE%\vcpkg_installed" -DVCPKG_INSTALL_OPTIONS=--only-binarycaching -DENABLE_TESTS=OFF -DBUILD_TESTING=OFF -DENABLE_SAMPLES=OFF -DCMAKE_INSTALL_PREFIX="%GITHUB_WORKSPACE%\stage\sdk\windows-x64"
          if errorlevel 1 exit /b 1
          cmake --build build\native-release --target RulesForge --parallel 2
          if errorlevel 1 exit /b 1
          cmake --install build\native-release
          if errorlevel 1 exit /b 1

      - name: Verify Windows SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $prefix = Join-Path $env:GITHUB_WORKSPACE "stage/sdk/windows-x64"
          foreach ($file in @(
            "include/rules_forge.h",
            "lib/cmake/RulesForge/RulesForgeConfig.cmake",
            "bin/RulesForge.dll",
            "lib/RulesForge.lib"
          )) {
            $path = Join-Path $prefix $file
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "missing SDK file: $path" }
          }
          @(
            "package=RulesForge.Native",
            "version=${{ needs.metadata.outputs.version }}",
            "rid=windows-x64",
            "salts=$env:SALTS_PACKAGE_VERSION",
            "saltsutils=$env:SALTS_UTILS_PACKAGE_VERSION",
            "databind_abi=9",
            "profile=release",
            "source=$env:GITHUB_SHA"
          ) | Set-Content -LiteralPath (Join-Path $prefix "rulesforge-sdk-manifest.txt") -Encoding ascii

      - uses: actions/upload-artifact@v4
        with:
          name: rulesforge-sdk-windows-x64
          path: stage/sdk/windows-x64
          if-no-files-found: error

  pack:
    name: Pack RulesForge.Native
    needs: [metadata, linux, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          pattern: rulesforge-sdk-*
          path: package/sdk
          merge-multiple: false

      - name: Normalize artifact layout
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p normalized/sdk
          cp -a package/sdk/rulesforge-sdk-linux-x64 normalized/sdk/linux-x64
          cp -a package/sdk/rulesforge-sdk-windows-x64 normalized/sdk/windows-x64
          rm -rf package
          mv normalized package
          test -f package/sdk/linux-x64/include/rules_forge.h
          test -f package/sdk/linux-x64/lib/cmake/RulesForge/RulesForgeConfig.cmake
          test -f package/sdk/linux-x64/lib/libRulesForge.so
          test -f package/sdk/windows-x64/include/rules_forge.h
          test -f package/sdk/windows-x64/lib/cmake/RulesForge/RulesForgeConfig.cmake
          test -f package/sdk/windows-x64/bin/RulesForge.dll
          test "$(find package/sdk -maxdepth 2 -name rulesforge-sdk-manifest.txt | wc -l)" -eq 2

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Configure GitHub Packages source
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          config="$RUNNER_TEMP/rulesforge-pack.config"
          printf '<?xml version="1.0" encoding="utf-8"?><configuration><packageSources><clear /></packageSources></configuration>\n' > "$config"
          dotnet nuget add source "https://nuget.pkg.github.com/qigao/index.json"             --name github --username qigao --password "$GITHUB_TOKEN"             --store-password-in-clear-text --configfile "$config"
          echo "NUGET_CONFIG=$config" >> "$GITHUB_ENV"

      - name: Create NuGet package
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore packaging/nuget/RulesForge.Native.csproj             --configfile "$NUGET_CONFIG" --packages "$RUNNER_TEMP/pack-nuget" --no-cache --force-evaluate
          dotnet pack packaging/nuget/RulesForge.Native.csproj             --no-restore --configuration Release --output dist             -p:PackageVersion=${{ needs.metadata.outputs.version }}             -p:PackageRoot="$GITHUB_WORKSPACE/package"             -p:RestorePackagesPath="$RUNNER_TEMP/pack-nuget"             -p:RepositoryCommit="$GITHUB_SHA"
          nupkg="dist/RulesForge.Native.${{ needs.metadata.outputs.version }}.nupkg"
          test -f "$nupkg"
          unzip -Z1 "$nupkg" | sort | tee "$RUNNER_TEMP/rulesforge-nupkg.txt"
          grep -Fx "sdk/linux-x64/include/rules_forge.h" "$RUNNER_TEMP/rulesforge-nupkg.txt"
          grep -Fx "sdk/linux-x64/lib/cmake/RulesForge/RulesForgeConfig.cmake" "$RUNNER_TEMP/rulesforge-nupkg.txt"
          grep -Fx "sdk/windows-x64/include/rules_forge.h" "$RUNNER_TEMP/rulesforge-nupkg.txt"
          grep -Fx "sdk/windows-x64/bin/RulesForge.dll" "$RUNNER_TEMP/rulesforge-nupkg.txt"
          unzip -p "$nupkg" "RulesForge.Native.nuspec" > "$RUNNER_TEMP/rulesforge.nuspec"
          if grep -E 'id="(Salts\.Native|SaltsUtils\.Native)"' "$RUNNER_TEMP/rulesforge.nuspec"; then
            echo "RulesForge.Native must not embed GitHub package dependency metadata" >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: RulesForge.Native.${{ needs.metadata.outputs.version }}
          path: dist/*.nupkg
          if-no-files-found: error

  publish:
    name: Publish package and GitHub Release
    needs: [metadata, pack]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: RulesForge.Native.${{ needs.metadata.outputs.version }}
          path: dist

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Create bootstrap tag when needed
        if: github.ref_type != 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.metadata.outputs.tag }}
          SOURCE_COMMIT: ${{ needs.metadata.outputs.source_commit }}
        run: |
          set -euo pipefail
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            existing="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq .object.sha)"
            test "$existing" = "$SOURCE_COMMIT"
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$SOURCE_COMMIT"
          fi

      - name: Publish to qigao GitHub Packages
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          dotnet nuget add source "https://nuget.pkg.github.com/qigao/index.json"             --name github --username qigao --password "$GITHUB_TOKEN"             --store-password-in-clear-text
          dotnet nuget push "dist/RulesForge.Native.${{ needs.metadata.outputs.version }}.nupkg"             --api-key "$GITHUB_TOKEN" --source github --skip-duplicate

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.metadata.outputs.tag }}
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $TAG already exists; package publish was idempotent"
            exit 0
          fi
          gh release create "$TAG" dist/*.nupkg             --repo "$GITHUB_REPOSITORY" --verify-tag             --title "RulesForge $VERSION" --generate-notes
