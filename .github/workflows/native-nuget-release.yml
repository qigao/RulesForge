name: RulesForge native SDK release
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
  packages: read
concurrency:
  group: rulesforge-sdk-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  VCPKG_CACHE_VERSION: ${{ vars.VCPKG_CACHE_VERSION }}
  SALTS_BASE_VERSION: ${{ vars.SALTS_BASE_VERSION }}
  CMETA_VERSION: ${{ vars.CMETA_VERSION }}
  SALTS_UTILS_VERSION: ${{ vars.SALTS_UTILS_VERSION }}
  SALTS_CORE_VERSION: ${{ vars.SALTS_CORE_VERSION }}
  TOAD_VERSION: ${{ vars.TOAD_VERSION }}
jobs:
  metadata:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Check SDK restore syntax
        shell: bash
        run: python3 -c 'from pathlib import Path; p = Path("cmake/ci/restore-native-sdks.py"); compile(p.read_text(encoding="utf-8"), str(p), "exec")'
      - id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(awk '/^[[:space:]]*VERSION [0-9]/{print $2; exit}' CMakeLists.txt)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          vcpkg_version="$(python3 -c 'import json; print(json.load(open("vcpkg.json", encoding="utf-8"))["version-semver"])')"
          if [[ "$vcpkg_version" != "$version" ]]; then
            echo "release version mismatch: CMake=$version vcpkg=$vcpkg_version" >&2
            exit 1
          fi

          header_major="$(awk '/^#define RULEFORGE_VERSION_MAJOR / {print $3; exit}' rulesforge/include/rules_forge.h)"
          header_minor="$(awk '/^#define RULEFORGE_VERSION_MINOR / {print $3; exit}' rulesforge/include/rules_forge.h)"
          header_patch="$(awk '/^#define RULEFORGE_VERSION_PATCH / {print $3; exit}' rulesforge/include/rules_forge.h)"
          header_string="$(awk '/^#define RULEFORGE_VERSION_STRING / {gsub(/"/, "", $3); print $3; exit}' rulesforge/include/rules_forge.h)"
          header_version="$header_major.$header_minor.$header_patch"
          if [[ "$header_version" != "$version" || "$header_string" != "$version" ]]; then
            echo "release version mismatch: CMake=$version public-header=$header_version public-header-string=$header_string" >&2
            exit 1
          fi

          nuget_version="$(python3 -c 'import xml.etree.ElementTree as ET; print(ET.parse("packaging/nuget/RulesForge.Native.csproj").find(".//PackageVersion").text)')"
          if [[ "$nuget_version" != "$version" ]]; then
            echo "release version mismatch: CMake=$version NuGet=$nuget_version" >&2
            exit 1
          fi

          tag="v$version"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            if [[ "$GITHUB_REF_NAME" != "$tag" ]]; then
              echo "release tag mismatch: pushed=$GITHUB_REF_NAME expected=$tag" >&2
              exit 1
            fi
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "version=$version-ci.$GITHUB_RUN_NUMBER.$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi
  build:
    name: ${{ matrix.profile }}
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: windows-latest, rid: windows-x64, profile: windows-llvm-mingw-x64, preset: ci-llvm-mingw-x64-release-user, triplet: qigao-x64-windows-llvm-mingw, host: windows-x64, native: true}
          - {runner: ubuntu-24.04, rid: linux-x64, profile: linux-clang-x64, preset: ci-llvm-native-release-user, triplet: x64-linux, host: linux-x64, native: true}
          - {runner: macos-15, rid: macos-arm64, profile: macos-clang-arm64, preset: ci-llvm-native-release-user, triplet: arm64-osx, host: macos-arm64, native: true}
          - {runner: ubuntu-24.04, rid: android-arm64-v8a, profile: android-arm64, preset: ci-android-arm64-release-user, triplet: arm64-android, host: linux-x64, native: false}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      VCPKG_CACHE_REPOSITORY_ROOT: ${{ github.workspace }}/build/infrastructure
      LLVM_NATIVE_TARGET_TRIPLET: ${{ matrix.triplet }}
      PRESET: ${{ matrix.preset }}
      RID: ${{ matrix.rid }}
      SDK_VERSION: ${{ needs.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: qigao/vcpkg-cache
          ref: v${{ env.VCPKG_CACHE_VERSION }}
          path: build/infrastructure
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Linux build tools
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang ninja-build pkg-config
      - name: Install macOS build tools
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          brew install ninja pkgconf llvm@18
      - name: Install Windows build tools
        if: runner.os == 'Windows'
        run: |
          choco install ninja pkgconfiglite --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: ./build/infrastructure/.github/actions/setup-llvm-mingw
        id: mingw
        if: runner.os == 'Windows'
      - name: Select the published Windows compiler
        if: runner.os == 'Windows'
        env:
          COMPILER_ROOT: ${{ steps.mingw.outputs.root }}
        run: |
          $root = $env:COMPILER_ROOT.Replace('\', '/')
          "LLVM_MINGW_ROOT=$root" >> $env:GITHUB_ENV
      - uses: ./build/infrastructure/.github/actions/setup-llvm-native
        if: matrix.native && runner.os != 'Windows'
      - name: Select Android NDK
        if: '!matrix.native'
        run: |
          if (!$env:ANDROID_NDK_HOME) { throw 'ANDROID_NDK_HOME is required' }
          Get-Content (Join-Path $env:ANDROID_NDK_HOME 'source.properties')
      - name: Restore exact published SDKs and generator tools
        run: |
          ./cmake/ci/restore-native-sdks.ps1 -Rid '${{ matrix.rid }}' -HostRid '${{ matrix.host }}' -Profile '${{ matrix.profile }}'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "SALTS_CI_VCPKG_INSTALLED_DIR=$env:VCPKG_INSTALLED_DIR" >> $env:GITHUB_ENV
      - name: Configure the complete build graph
        run: |
          $configure = @('--fresh', '--preset', $env:PRESET)
          if ('${{ matrix.native }}' -eq 'false') {
            $configure += @(
              "-DSaltsUtils_IDLC_EXECUTABLE:FILEPATH=$env:SALTS_UTILS_HOST_ROOT/bin/salts-idlc",
              "-DSaltsUtils_IDLC_HOST_SALTS_BASE_ROOT:PATH=$env:SALTS_BASE_HOST_ROOT",
              "-DSaltsUtils_IDLC_HOST_CMETA_ROOT:PATH=$env:CMETA_HOST_ROOT")
          }
          cmake @configure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build the complete graph
        run: |
          cmake --build --preset $env:PRESET --parallel 3
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run the complete formal CTest suite
        if: matrix.native
        run: |
          ctest --preset $env:PRESET --no-tests=error --output-on-failure --timeout 180 --output-junit "build/$env:PRESET/ctest.xml"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install and archive the SDK
        run: |
          cmake --build --preset "install-$env:PRESET"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $prefix = "build/$env:PRESET/stage"
          @{schema=1; version=$env:SDK_VERSION; commit='${{ github.event.pull_request.head.sha || github.sha }}';
            rid=$env:RID; profile='${{ matrix.profile }}'; producer_run=$env:GITHUB_RUN_ID;
            native_tests='${{ matrix.native }}';
            dependencies=@{vcpkg_cache=$env:VCPKG_CACHE_VERSION; SaltsBase=$env:SALTS_BASE_VERSION;
              CMeta=$env:CMETA_VERSION; SaltsUtils=$env:SALTS_UTILS_VERSION;
              CNet=$env:SALTS_CORE_VERSION; Toad=$env:TOAD_VERSION}} |
            ConvertTo-Json -Depth 5 | Set-Content "$prefix/rulesforge-sdk-manifest.json" -Encoding utf8
          New-Item -ItemType Directory -Path "stage/$env:RID", dist -Force | Out-Null
          Copy-Item -Path "$prefix/*" -Destination "stage/$env:RID" -Recurse
          tar -czf "dist/rulesforge-${env:SDK_VERSION}-${{ matrix.profile }}.tar.gz" -C stage $env:RID
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify Android ELF load-segment alignment
        if: '!matrix.native'
        run: |
          $readelf = Join-Path $env:ANDROID_NDK_HOME 'toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf'
          $libraries = Get-ChildItem "build/$env:PRESET/stage" -Recurse -Filter '*.so'
          if (!$libraries) { throw 'Android SDK contains no shared ELF libraries' }
          foreach ($library in $libraries) {
            $headers = & $readelf --program-headers --wide $library.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $loads = @($headers | Where-Object { $_ -match '^\s*LOAD\s' })
            if (!$loads.Count) { throw "No LOAD segments: $($library.FullName)" }
            foreach ($load in $loads) {
              if ($load -notmatch '\s(0x[0-9a-fA-F]+)\s*$' -or [Convert]::ToUInt64($Matches[1], 16) -lt 16384) {
                throw "ELF LOAD alignment below 16 KiB: $($library.FullName): $load"
              }
            }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: rulesforge-sdk-${{ matrix.profile }}
          path: dist/*.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rulesforge-diagnostics-${{ matrix.profile }}
          path: |
            build/${{ matrix.preset }}/ctest.xml
            build/${{ matrix.preset }}/CMakeCache.txt
            build/${{ matrix.preset }}/Testing/Temporary
            build/${{ matrix.preset }}/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: warn
  pack:
    needs: [metadata, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: rulesforge-sdk-*
          merge-multiple: true
          path: dist
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Pack the qualified SDKs
        env:
          SDK_VERSION: ${{ needs.metadata.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p package/sdk
          for profile in windows-llvm-mingw-x64 linux-clang-x64 macos-clang-arm64 android-arm64; do
            tar -xzf "dist/rulesforge-$SDK_VERSION-$profile.tar.gz" -C package/sdk
          done
          for rid in windows-x64 linux-x64 macos-arm64 android-arm64-v8a; do
            test -f "package/sdk/$rid/include/rules_forge.h"
            test -f "package/sdk/$rid/lib/cmake/RulesForge/RulesForgeTargets.cmake"
          done
          dotnet pack packaging/nuget/RulesForge.Native.csproj --configuration Release --output dist \
            "-p:PackageVersion=$SDK_VERSION" "-p:PackageRoot=$GITHUB_WORKSPACE/package"
          (cd dist && sha256sum *.tar.gz *.nupkg > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: rulesforge-release
          path: dist/*
          if-no-files-found: error
  publish:
    name: Publish RulesForge release
    needs: [metadata, pack]
    if: startsWith(github.ref, 'refs/tags/v') && needs.metadata.outputs.release == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: rulesforge-release
          path: dist
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Verify release asset checksums
        run: cd dist && sha256sum --check SHA256SUMS
      - name: Publish RulesForge.Native
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SDK_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          dotnet nuget add source https://nuget.pkg.github.com/qigao/index.json --name github \
            --username qigao --password "$GITHUB_TOKEN" --store-password-in-clear-text
          dotnet nuget push "dist/RulesForge.Native.$SDK_VERSION.nupkg" --source github --api-key "$GITHUB_TOKEN"
      - name: Publish GitHub Release with qualified SDKs
        env:
          GH_TOKEN: ${{ github.token }}
          SDK_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "v$SDK_VERSION" dist/* --verify-tag \
            --title "RulesForge $SDK_VERSION" --generate-notes
